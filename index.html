<style>:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0}

/* Layout: single phone-first column, today-first; weekly rings as the anchor, a small progress ring on every habit row; bottom tab bar; habit detail as a full-screen layer. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EDF0F4; --line:#DCE2EA;
  --ink:#121722; --ink-2:#4A5466; --ink-3:#7C8697; --accent:#2B5BD7; --on-accent:#FFFFFF;
  --c1:#2B5BD7; --c2:#E2553A; --c3:#1F9D6B; --c4:#8A4FD3; --c5:#C98A00; --c6:#0F8FA8; --c7:#D2438F; --c8:#5B6B82;
  --warn:#B86E00; --warn-bg:#FFF4E0; --bad:#C2342B; --bad-bg:#FDECEA; --good:#1F8A5E; --good-bg:#E5F6EE;
  --shadow:0 1px 2px rgba(18,23,34,.04),0 6px 18px rgba(18,23,34,.05);
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161B23; --sunk:#1F2530; --line:#29313D;
  --ink:#EEF1F6; --ink-2:#B3BCCB; --ink-3:#7F8A9C; --accent:#6E95FF; --on-accent:#0D1015;
  --c1:#6E95FF; --c2:#FF7A5C; --c3:#3CCB92; --c4:#B58CFF; --c5:#F0B63C; --c6:#3CC3DC; --c7:#FF7AB8; --c8:#9AA8BD;
  --warn:#F2B04A; --warn-bg:#2B2210; --bad:#FF6B5E; --bad-bg:#2D1614; --good:#4FD39B; --good-bg:#11271D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161B23; --sunk:#1F2530; --line:#29313D;
  --ink:#EEF1F6; --ink-2:#B3BCCB; --ink-3:#7F8A9C; --accent:#6E95FF; --on-accent:#0D1015;
  --c1:#6E95FF; --c2:#FF7A5C; --c3:#3CCB92; --c4:#B58CFF; --c5:#F0B63C; --c6:#3CC3DC; --c7:#FF7AB8; --c8:#9AA8BD;
  --warn:#F2B04A; --warn-bg:#2B2210; --bad:#FF6B5E; --bad-bg:#2D1614; --good:#4FD39B; --good-bg:#11271D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:13px} .note{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.link{border:0;background:none;padding:0;font-weight:600;text-align:left;font-family:var(--f-display);font-size:15px}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.added{opacity:.5}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--ink-2)}
.skin i{width:38px;height:38px;border-radius:12px;border:2px solid transparent;display:block}
.skin[aria-pressed="true"] i{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.tick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--sunk);border:0;text-align:left;width:100%}
.tick .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.tick[aria-pressed="true"] .box{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent))}
.tick[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick .t{font-weight:600} .tick .s{font-size:12px;color:var(--ink-3)}
.hab{display:flex;flex-direction:column;gap:10px;padding-block:12px;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.grp + .hab{border-top:0}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.ringbtn{width:44px;height:44px;border:0;background:none;padding:0;border-radius:50%;display:block}
.hname{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.hname .t{font-family:var(--f-display);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname .s{font-size:12px;color:var(--ink-3)}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.sk{background:none;border:1px dashed var(--ink-3)}
.hval{font-family:var(--f-mono);font-size:13px;white-space:nowrap;text-align:right;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--hc);flex:none}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hc,var(--accent));border-radius:99px;max-width:100%}
input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.ins input{background:var(--surface)} .ins .tick{background:var(--surface)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--accent)}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner.bad{background:var(--bad-bg)} .banner.bad h3{color:var(--bad)}
.banner.warn{background:var(--warn-bg)} .banner.warn h3{color:var(--warn)}
.banner.good{background:var(--good-bg)} .banner.good h3{color:var(--good)}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-display);font-size:16px;font-weight:500}
.rings{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.legend .v{font-family:var(--f-mono);font-size:15px}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.timer{font-family:var(--f-mono);font-size:40px;font-weight:500;letter-spacing:-.02em;color:var(--hc,var(--accent))}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500;white-space:nowrap}
.stat .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.part{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.sl{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}
.svgtext{fill:var(--ink-3);font-family:var(--f-mono);font-size:9px}
.ins{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--sunk);border-radius:12px}
.ins b{font-family:var(--f-display);font-weight:600}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-family:var(--f-display);font-size:16px}
.tpl .hs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2)}
.tpl .hs span{display:inline-flex;align-items:center;gap:5px}
.tpl .hs i{width:7px;height:7px;border-radius:50%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:10px;text-align:center;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.cal button{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding:0;position:relative;overflow:hidden}
.cal button>i{position:absolute;inset:0;background:var(--hc);pointer-events:none}
.cal button>span{position:relative}
.cal button.on{color:#fff}
.cal button.sk{border:1px dashed var(--ink-3);background:transparent}
.cal button.sel{border:2px solid var(--ink)}
.cal button:disabled{opacity:.3;cursor:default}
.grid7{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,24px);gap:5px;align-items:center}
.grid7 .cell{width:24px;height:24px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--ink-3)}
.grid7 .cell>i{position:absolute;inset:0;background:var(--hc)}
.grid7 .hd{font-size:10px;text-align:center;color:var(--ink-3);font-weight:600}
.grid7 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;border:0;background:none;padding:0;text-align:left}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
ul.lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:8px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;max-width:90vw}
@media (max-width:380px){.rings{grid-template-columns:112px 1fr}.big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.ringarc{transition:stroke-dasharray .5s ease}}
</style>

<body>
<div class="wrap" id="app">
  <div class="card"><div class="eyebrow">Loading</div><h2>Opening your habits…</h2><p class="muted small">Your habits, goals and streaks appear here once they load.</p></div>
</div>
<nav class="tabs" aria-label="Sections" id="tabbar" hidden><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
/* ---------- helpers ---------- */
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], PAL = ["c1","c2","c3","c4","c5","c6","c7","c8"];
const TOD = [["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"],["any","Any time"]];
const SKINS = {ocean:{n:"Ocean",a:["#2B5BD7","#6E95FF"],bg:["#F3F5F8","#0D1015"]}, forest:{n:"Forest",a:["#1F7A52","#4FD39B"],bg:["#F1F5F2","#0B110E"]}, sunset:{n:"Sunset",a:["#D4502B","#FF8A5C"],bg:["#F8F4F0","#14100D"]},
  grape:{n:"Grape",a:["#7443C4","#B58CFF"],bg:["#F4F2F8","#100D15"]}, rose:{n:"Rose",a:["#C2367B","#FF7AB8"],bg:["#F8F2F5","#150D11"]}, graphite:{n:"Graphite",a:["#3A4658","#AEBBD0"],bg:["#F2F3F4","#0E0F11"]}};
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const dowIdx = d => (d.getDay()+6)%7;
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const fmt = (d,o={day:"numeric",month:"short"}) => d.toLocaleDateString("en-GB",o);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h1 = n => (Math.round(n*10)/10).toFixed(1);
const r1 = n => Math.round(n*10)/10;
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const ALL = [0,1,2,3,4,5,6], WK = [0,1,2,3,4];
const today = () => { const n = new Date(Date.now() - (+(S.cfg?.roll)||0)*3600000); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const wsI = () => S.cfg?.ws === "sun" ? 6 : 0;
const weekOf = d => addDays(d, -((dowIdx(d) - wsI() + 7) % 7));
const dowOrder = () => ALL.map(i => (i + wsI()) % 7);

/* ---------- library + templates ---------- */
const P = (name,type,o={}) => ({name,type,...o});
const LIB = {
  "Health":[P("Drink water","count",{target:8,unit:"glasses",color:"c6"}), P("Sleep 7+ hours","count",{target:7,unit:"h",color:"c4",tod:"morning",q:"How many hours did you sleep?"}), P("In bed by 11pm","check",{color:"c4",tod:"evening"}),
    P("Take vitamins","check",{color:"c5",tod:"morning"}), P("Eat vegetables","count",{target:3,unit:"servings",color:"c3"}), P("No added sugar","check",{color:"c7"}), P("Floss","check",{color:"c6",tod:"evening"}),
    P("No alcohol","check",{color:"c8"}), P("Cook at home","check",{sch:{k:"week",n:5},color:"c5"})],
  "Fitness":[P("Workout","check",{sch:{k:"week",n:3},color:"c2"}), P("Run","count",{target:5,unit:"km",sch:{k:"week",n:3},color:"c2"}), P("Steps","count",{target:8000,unit:"steps",step:1000,color:"c3"}),
    P("Stretch","time",{target:10,color:"c3",presets:[10,5]}), P("Yoga","time",{target:20,sch:{k:"week",n:3},color:"c4",presets:[20,10]}), P("Play a sport","check",{sch:{k:"week",n:1},color:"c5"}), P("Push-ups","count",{target:30,unit:"reps",step:10,color:"c2"})],
  "Mind":[P("Meditate","time",{target:10,color:"c3",tod:"morning",presets:[10,5]}), P("Journal","check",{color:"c4",tod:"evening"}), P("Gratitude list","count",{target:3,unit:"things",color:"c5",tod:"evening"}),
    P("Breathing exercise","time",{target:5,color:"c6",presets:[5,3]}), P("Time outdoors","time",{target:20,color:"c3",presets:[20,10]}), P("Call family or a friend","check",{sch:{k:"week",n:2},color:"c7"}), P("No phone for the first hour","check",{color:"c8",tod:"morning"})],
  "Learning":[P("Study","time",{target:60,color:"c1",tod:"evening"}), P("Read","time",{target:20,color:"c6",tod:"evening",presets:[20,10]}), P("Read pages","count",{target:20,unit:"pages",step:5,color:"c6"}),
    P("Language practice","time",{target:15,color:"c5",presets:[15,5]}), P("Practise an instrument","time",{target:20,color:"c7",presets:[20,10]}), P("Online course","time",{target:30,sch:{k:"week",n:4},color:"c1"}), P("Flashcards","count",{target:30,unit:"cards",step:10,color:"c4"})],
  "Work":[P("Deep work","time",{target:90,sch:{k:"days",days:WK},color:"c1",tod:"morning",presets:[50,25]}), P("Plan the day","check",{sch:{k:"days",days:WK},color:"c5",tod:"morning"}), P("Clear inbox","check",{sch:{k:"days",days:WK},color:"c8",tod:"afternoon"}),
    P("Side project","time",{target:45,sch:{k:"week",n:3},color:"c4"}), P("Job application","check",{sch:{k:"week",n:2},color:"c2"}), P("Networking message","check",{sch:{k:"week",n:3},color:"c7"})],

function vDetail(h){

      <polygon points="0,${y(0)} ${line} ${W},${y(0)}" fill="${c}" fill-opacity=".14"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${W-3}" cy="${y(pts[pts.length-1].sc)}" r="3.5" fill="${c}"/>

/* ---------- insights ---------- */
function vInsights(){

  if (!hs.length) return html + `<div class="card"><h2>Nothing to show yet</h2><p class="muted">Add habits and log a few days.</p></div>`;
  const days7 = []; for (let i=6;i>=0;i--) days7.push(addDays(t,-i));

    ${hs.map(h => `<button class="nm" data-act="detail" data-h="${h.id}">${esc(h.name)}</button>` + days7.map(d => { const k = key(d), f = k < h.start ? 0 : frac(h,k); return `<div class="cell" style="--hc:${col(h)}" title="${k}">${skipped(k,h.id) ? "–" : f > 0 ? `<i style="opacity:${Math.max(.3,f)}"></i>` : ""}</div>`; }).join("")).join("")}</div></div>`;
  const ranked = hs.map(h=>({h, s:score(h), st:streaks(h)})).sort((a,b)=>b.s-a.s);
  html += `<div class="card"><div class="row between"><h2>Habit strength</h2><span class="note">Strongest first</span></div>${ranked.map(x=>`<div class="col" style="gap:5px;--hc:${col(x.h)}"><div class="row between small"><button class="link" style="font-size:13px" data-act="detail" data-h="${x.h.id}">${esc(x.h.name)}</button><span class="num">${Math.round(x.s*100)}%${x.st.cur?` · ${x.st.cur} ${x.st.unit}`:""}</span></div><div class="bar"><i style="width:${x.s*100}%"></i></div></div>`).join("")}</div>`;
  const W = 320, Ht = 120, n = 12, bw = W/n; let bars = "";
  for (let i=n-1;i>=0;i--){ const ws = addDays(weekOf(t), -7*i), end = key(addDays(ws,6)) > tk ? tk : key(addDays(ws,6)); const live = hs.filter(h => h.start <= end);
    const sc = live.length ? live.reduce((a,h)=>{ const e = expected(h,ws,end); return a + (e>0 ? Math.min(1,weekDone(h,ws,end)/e) : 1); },0)/live.length : 0, x = (n-1-i)*bw, hh = sc*(Ht-34);
    bars += `<rect x="${x+3}" y="${Ht-20-hh}" width="${bw-6}" height="${hh}" rx="3" fill="var(--accent)" fill-opacity="${i?".55":"1"}"/>${live.length?`<text class="svgtext" x="${x+bw/2}" y="${Ht-24-hh}" text-anchor="middle">${Math.round(sc*100)}</text>`:""}${i%3===0?`<text class="svgtext" x="${x+bw/2}" y="${Ht-6}" text-anchor="middle">${fmt(ws)}</text>`:""}`; }
  html += `<div class="card"><div class="row between"><h2>Weekly score</h2><span class="note">Last 12 weeks</span></div><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Weekly score for the last 12 weeks">${bars}</svg></div>`;
  const dk = Object.values(S.months).flatMap(m => Object.keys(m.d||{})).filter(k => k <= tk);
  const timeHs = hs.filter(x=>x.type==="time"&&!isMax(x)), metric = k => timeHs.length ? timeHs.reduce((a,x)=>a+val(k,x.id),0) : hs.filter(x=>kept(x,k)).length, mu = timeHs.length ? "min of timed habits" : "habits kept";

    : `<div class="ins"><b>${title}</b><span class="small">${la}: <span class="num">${h1(avg(a))}</span> ${mu} on average. ${lb}: <span class="num">${h1(avg(b))}</span>.</span></div>`;

  if (tr.energy) { const s = dk.filter(k=>day(k).energy!=null); parts.push(cmp("Energy", s.filter(k=>day(k).energy>=4).map(metric), s.filter(k=>day(k).energy<=3).map(metric), "Energy 4–5", "Energy 1–3")); }

  const wkd = dk.filter(k=>dowIdx(parse(k))<5), wke = dk.filter(k=>dowIdx(parse(k))>=5); parts.push(cmp("Weekdays and weekends", wkd.map(metric), wke.map(metric), "Weekdays", "Weekends"));
  html += `<div class="card"><h2>Patterns</h2>${parts.join("")}</div>`;
  return html;
}

      ${(e.conds||[]).map((x,i)=>`<div class="row"><select class="grow" data-ec="${i}" data-f="habitId" aria-label="Habit">${habits().map(h=>`<option value="${h.id}" ${h.id===x.habitId?"selected":""}>${esc(h.name)}</option>`).join("")}</select><input type="number" style="width:76px" min="5" max="100" step="5" data-ec="${i}" data-f="pct" value="${x.pct}" aria-label="Percent of weekly target"><span class="note">% of week</span><button class="btn sm danger" data-act="ec-del" data-i="${i}">Remove</button></div>`).join("")}
      <button class="btn sm" data-act="ec-add" ${habits().length?"":"disabled"}>Add a habit condition</button>
      <label class="f">Other conditions you tick yourself, one per line<textarea id="earnManual" placeholder="e.g. Tomorrow's study block is booked">${esc((e.manual||[]).join("\n"))}</textarea></label>` : ""}</div>`;
  html += `<div class="card"><h2>If-then rules</h2><label class="f">One per line<textarea id="rules" rows="5" placeholder="If I miss a day → the next day I do the smallest version first thing.">${esc((c.rules||[]).join("\n"))}</textarea></label></div>`;
  html += `<div class="card"><h2>Back up your data</h2><p class="note">Your data lives in this browser. Export a copy now and then, and import it to move to another device.</p>
    <div class="row"><button class="btn sm" data-act="export">Export a backup</button><button class="btn sm" data-act="csv">Export CSV</button><label class="btn sm" style="cursor:pointer">Import a backup<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>
    <p class="note">Importing replaces everything on this device.</p></div>`;
  html += `<div class="card"><h2>Install on your phone</h2><ul class="lines small"><li><b>iPhone:</b> open this page in Safari, tap Share, then "Add to Home Screen".</li><li><b>Android:</b> open it in Chrome, tap the menu, then "Install app" or "Add to Home screen".</li></ul><p class="note">Once installed it opens full screen and works offline.</p></div>`;
  html += `<div class="card"><h2>Start again from a template</h2><p class="note">Replaces your habits with a new set you can edit first. Logged days are kept.</p><button class="btn sm" data-act="retpl">Choose a template</button></div>`;
  return html;
}

/* ---------- render ---------- */
const TABS = [
  {id:"today", label:"Today", icon:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>'},
  {id:"habits", label:"Habits", icon:'<path d="M4 7h10M4 12h16M4 17h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><circle cx="18" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/>'},
  {id:"insights", label:"Insights", icon:'<path d="M5 19V11M12 19V5M19 19v-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>'},
  {id:"goals", label:"Goals", icon:'<path d="M6 21V4M6 5h11l-2.5 3.5L17 12H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'},
  {id:"settings", label:"Settings", icon:'<circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'},
];
let pending = false, lastView = "";
function render(){
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest("#app") && ae.matches("input[type=text],input[type=number],input[type=date],textarea")) { pending = true; return; }
  pending = false; S.memo = {};
  const app = document.getElementById("app"), bar = document.getElementById("tabbar");
  if (S.mode === "loading") { if (S.slow) app.innerHTML = `<div class="card"><div class="eyebrow">Still loading</div><h2>Can't reach your data yet</h2><p class="muted small">This page keeps trying. Check your connection.</p></div>`; return; }
  applySkin();
  const dh = S.detail ? hab(S.detail) : null;
  const view = S.adding ? "add" : S.setup ? "setup" : (!S.cfg || S.onboarding) ? "onboard" : dh ? "detail:"+dh.id+(S.edit?":e":"") : S.tab;
  bar.hidden = view === "onboard" || view === "setup" || view === "add";
  document.getElementById("tabs").innerHTML = TABS.map(t=>`<button data-tab="${t.id}" ${S.tab===t.id&&!dh?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg>${t.label}</button>`).join("");
  const y = window.scrollY;
  app.innerHTML = view === "add" ? vAdd() : view === "setup" ? vSetup() : view === "onboard" ? vOnboard() : dh ? vDetail(dh) : ({today:vToday, goals:vGoals, insights:vInsights, habits:vHabits, settings:vSettings}[S.tab] || vToday)();
  window.scrollTo(0, view === lastView ? y : 0); lastView = view;
  const t = getTimer(), el = document.getElementById("timerDisplay"); if (t && el) { const left = Math.max(0, t.dur*60 - Math.floor((Date.now()-t.start)/1000)); el.textContent = `${pad(Math.floor(left/60))}:${pad(left%60)}`; }
}
document.addEventListener("focusout", () => setTimeout(() => { if (pending) render(); }, 0));
const go = tab => { S.tab = tab; S.detail = null; S.edit = false; try { localStorage.setItem("nt_tab", tab); } catch(e){} render(); };
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); });

/* ---------- events ---------- */
const findH = (id, where) => where === "setup" ? S.setup?.habits.find(h=>h.id===id) : hab(id);
const setSch = (h,k) => { h.sch = k === "daily" ? {k} : k === "days" ? {k, days:(h.sch.days && h.sch.days.length ? h.sch.days : WK.slice())} : {k, n: k === "week" ? Math.min(7, h.sch.n||3) : k === "month" ? (h.sch.n||4) : Math.max(2, h.sch.n||2)}; };
document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, c = S.cfg, tk = key(today()), k = S.date && S.date < tk ? S.date : tk, d = day(k), n = +b.dataset.n, v = b.dataset.v;
  const h = b.dataset.h ? (a.startsWith("setup") ? findH(b.dataset.h,"setup") : hab(b.dataset.h)) : null;
  if (a !== "h-del" && a !== "g-del") S.confirm = null;
  switch (a) {
    case "tpl": { const hs = tplHabits(v); S.setup = {tpl:v, habits:hs, on:Object.fromEntries(hs.map(x=>[x.id,true]))}; S.onboarding = false; render(); break; }
    case "tpl-cancel": S.onboarding = false; render(); break;
    case "retpl": S.onboarding = true; render(); break;
    case "setup-back": S.setup = null; S.onboarding = true; render(); break;
    case "setup-on": S.setup.on[h.id] = !S.setup.on[h.id]; render(); break;
    case "setup-sch": setSch(h, v); render(); break;
    case "setup-add": S.adding = true; render(); break;
    case "setup-go": { const hs = S.setup.habits.filter(x=>S.setup.on[x.id]); let r = 0; hs.forEach(x => { x.ring = x.ring && ++r <= 3; });
      S.cfg = c ? {...c, habits:[...allHabits().filter(x=>x.archived), ...hs]} : newCfg(hs); S.setup = null; S.onboarding = false; S.tab = hs.length ? "today" : "habits"; S.detail = null; saveCfg(); break; }
    case "h-add": S.adding = true; render(); break;
    case "add-close": S.adding = false; render(); break;
    case "lib": { const src = v ? libFind(v) : {name:"New habit"}, nh = H(src, {color: src.color || PAL[allHabits().length % PAL.length]}); S.adding = false;
      if (S.setup) { S.setup.habits.push(nh); S.setup.on[nh.id] = true; render(); break; }
      nh.ring = habits().filter(x=>x.ring).length < 3; c.habits.push(nh); S.detail = nh.id; S.edit = true; saveCfg(); break; }
    case "detail": S.detail = b.dataset.h; S.edit = false; S.cal = null; S.calDay = null; render(); break;
    case "detail-close": S.detail = null; S.edit = false; render(); break;
    case "edit": S.edit = true; render(); break;
    case "edit-done": S.edit = false; render(); break;
    case "h-edit": S.detail = b.dataset.h; S.edit = true; render(); break;
    case "date": S.date = n === 0 ? null : key(addDays(parse(k), n)); if (S.date >= tk) S.date = null; render(); break;
    case "check": setEnt(k, h.id, ent(k,h.id) ? undefined : 1); break;
    case "zero": setEnt(k, h.id, 0); break;
    case "add": { const nv = Math.max(0, r1(val(k,h.id) + n)); setEnt(k, h.id, nv === 0 && !isMax(h) ? undefined : nv); break; }
    case "skip-today": setMap(tk, "s", h.id, !skipped(tk,h.id)); break;
    case "timer": putTimer({start:Date.now(), dur:n, hid:h.id, day:tk}); render(); break;
    case "timer-stop": stopTimer(false); break;
    case "pa": saveDay(k,{pa:!d.pa}); break;
    case "energy": saveDay(k,{energy: d.energy===+v ? null : +v}); break;
    case "em": { const em = {...(d.em||{})}; em[b.dataset.i] = !em[b.dataset.i]; saveDay(k,{em}); break; }
    case "eu": saveDay(k,{eu:!d.eu}); break;
    case "cal-nav": { const [y,m] = (S.cal || tk.slice(0,7)).split("-").map(Number), nd = new Date(y, m-1+n, 1); S.cal = `${nd.getFullYear()}-${pad(nd.getMonth()+1)}`; S.calDay = null; render(); break; }
    case "cal-day": S.calDay = S.calDay === v ? null : v; render(); break;
    case "day-check": setEnt(b.dataset.k, h.id, ent(b.dataset.k,h.id) ? undefined : 1); break;
    case "day-skip": setMap(b.dataset.k, "s", h.id, !skipped(b.dataset.k,h.id)); break;
    case "h-type": h.type = v; h.target = v==="time"?30:v==="count"?8:1; if (v === "check") h.dir = "min"; saveCfg(); break;
    case "h-dir": h.dir = v; saveCfg(); break;
    case "h-tod": h.tod = v; saveCfg(); break;
    case "h-day": h.sch.days = h.sch.days.includes(n) ? h.sch.days.filter(x=>x!==n) : [...h.sch.days,n].sort(); if (!h.sch.days.length) h.sch.days = [n]; saveCfg(); break;
    case "h-color": h.color = v; saveCfg(); break;
    case "h-ring": if (!h.ring && habits().filter(x=>x.ring).length >= 3) { toast("Three rings at most. Turn one off first."); break; } h.ring = !h.ring; saveCfg(); break;
    case "h-move": { const act = habits(), i = act.indexOf(h), o = act[i+n]; if (!o) break; const ia = c.habits.indexOf(h), ib = c.habits.indexOf(o); c.habits[ia] = o; c.habits[ib] = h; saveCfg(); break; }
    case "h-arch": h.archived = !h.archived; if (h.archived) { h.ring = false; S.detail = null; S.edit = false; } saveCfg(); toast(h.archived ? "Archived. Find it at the bottom of Habits." : "Restored"); break;
    case "h-del": if (S.confirm !== "h"+h.id) { S.confirm = "h"+h.id; render(); break; } S.confirm = null; c.habits = c.habits.filter(x=>x!==h); c.earn.conds = (c.earn.conds||[]).filter(x=>x.habitId!==h.id); S.detail = null; S.edit = false; saveCfg(); break;
    case "g-add": { const g = {id:uid(), name:"New goal", start:tk, deadline:key(addDays(today(),90)), habitId:(habits().find(x=>x.type==="time"&&!isMax(x))||{}).id||"", parts:[{id:uid(),name:"Part 1",hours:10,pct:0}]}; c.goals = [...(c.goals||[]), g]; S.editG = g.id; saveCfg(); break; }
    case "g-edit": S.editG = b.dataset.g || null; render(); break;
    case "g-del": { const g = b.dataset.g; if (S.confirm !== "g"+g) { S.confirm = "g"+g; render(); break; } S.confirm = null; c.goals = c.goals.filter(x=>x.id!==g); saveCfg(); break; }
    case "p-add": { const g = c.goals.find(x=>x.id===b.dataset.g); g.parts.push({id:uid(), name:`Part ${g.parts.length+1}`, hours:10, pct:0}); saveCfg(); break; }
    case "p-del": { const g = c.goals.find(x=>x.id===b.dataset.g); g.parts = g.parts.filter(p=>p.id!==b.dataset.p); saveCfg(); break; }
    case "tr": c.track = {...c.track, [v]: !c.track?.[v]}; saveCfg(); break;
    case "set": c[v] = v === "group" || v === "tiny" ? c[v] === false : !c[v]; saveCfg(); break;
    case "ws": c.ws = v; saveCfg(); break;
    case "theme": c.theme = v; saveCfg(); break;
    case "skin": c.skin = v; saveCfg(); break;
    case "earn-on": c.earn = {label:"Night out", conds:[], manual:[], ...c.earn, on:!c.earn?.on}; saveCfg(); break;
    case "ec-add": c.earn.conds = [...(c.earn.conds||[]), {habitId:habits()[0].id, pct:70}]; saveCfg(); break;
    case "ec-del": c.earn.conds.splice(+b.dataset.i,1); saveCfg(); break;
  }
});
document.getElementById("app").addEventListener("input", e => { const el = e.target;
  if (el.id === "sleep") document.getElementById("sleepVal").textContent = h1(+el.value)+" h";
  if (el.dataset.p && el.dataset.f === "pct") document.getElementById("pp-"+el.dataset.p).textContent = el.value+"%"; });
document.getElementById("app").addEventListener("change", e => {
  const el = e.target, tk = key(today()), k = S.date && S.date < tk ? S.date : tk, c = S.cfg, ds = el.dataset, lines = v => v.split("\n").map(x=>x.trim()).filter(Boolean), num = (lo,hi,def) => Math.max(lo, Math.min(hi, el.value === "" || Number.isNaN(+el.value) ? def : +el.value));
  if (el.id === "sleep") return saveDay(k,{sleep:+el.value});
  if (el.id === "screen") return saveDay(k,{screen: el.value === "" ? null : +el.value});
  if (el.id === "prep") return saveDay(k,{prep: el.value.trim()});
  if (ds.f === "dayval") return setEnt(ds.k, ds.h, el.value === "" ? undefined : Math.max(0, +el.value || 0));
  if (ds.f === "daynote") return setMap(ds.k, "n", ds.h, el.value.trim());
  if (ds.h) { const h = findH(ds.h, ds.w); if (!h) return; const f = ds.f;
    if (f === "name") h.name = el.value.trim() || "Habit"; else if (f === "q" || f === "desc" || f === "unit") h[f] = el.value.trim();
    else if (f === "target") h.target = num(0, 100000, h.target); else if (f === "step") h.step = num(1, 10000, 1);
    else if (f === "presets") { const p = el.value.split(/[,\s]+/).map(Number).filter(x=>x>=1&&x<=600).slice(0,3); h.presets = p.length ? p : [25,10]; }
    else if (f === "sch.k") setSch(h, el.value); else if (f === "sch.n") h.sch.n = Math.round(num(h.sch.k==="interval"?2:1, h.sch.k==="week"?7:h.sch.k==="month"?31:90, h.sch.n));
    else if (f === "start" && el.value) h.start = el.value; else return;
    return ds.w === "setup" ? render() : saveCfg(); }
  if (!c) return;
  if (el.id === "why") c.why = el.value.trim();
  else if (el.id === "rules") c.rules = lines(el.value);
  else if (el.id === "roll") c.roll = +el.value || 0;
  else if (el.id === "earnLabel") c.earn.label = el.value.trim() || "Reward";
  else if (el.id === "earnManual") c.earn.manual = lines(el.value);
  else if (ds.ec) c.earn.conds[+ds.ec][ds.f] = ds.f === "pct" ? num(5,100,70) : el.value;
  else if (ds.g && ds.p) { const p = c.goals.find(g=>g.id===ds.g)?.parts.find(p=>p.id===ds.p); if (!p) return; p[ds.f] = ds.f === "name" ? (el.value.trim()||"Part") : Math.max(0, +el.value||0); }
  else if (ds.g) { const g = c.goals.find(g=>g.id===ds.g); if (!g) return; if (ds.f === "name") g.name = el.value.trim()||"Goal"; else if (ds.f === "habitId") g.habitId = el.value; else if (el.value) g[ds.f] = el.value; }
  else return;
  saveCfg();
});

document.getElementById("app").addEventListener("click", e => {
  if (!e.target.closest('[data-act="export"]')) return;
  const blob = new Blob([JSON.stringify({app:"never-twice", v:1, exported:new Date().toISOString(), cfg:S.cfg, months:S.months}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `never-twice-backup-${key(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("Backup exported");
});
document.getElementById("app").addEventListener("click", e => {
  if (!e.target.closest('[data-act="csv"]')) return;
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`, rows = [["date","habit","value","unit","kept","skipped","note"]];
  Object.keys(S.months).sort().forEach(ym => Object.keys(S.months[ym].d||{}).sort().forEach(k => { const d = S.months[ym].d[k];
    allHabits().forEach(h => { const e = d.h?.[h.id], sk = !!d.s?.[h.id], n = d.n?.[h.id]; if (e === undefined && !sk && !n) return; rows.push([k, h.name, e ?? "", unit(h), kept(h,k) ? "yes" : "no", sk ? "yes" : "no", n || ""]); }); }));
  const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n")], {type:"text/csv"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `never-twice-${key(today())}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("CSV exported");
});
document.getElementById("app").addEventListener("change", async e => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  try { const d = JSON.parse(await e.target.files[0].text());
    if (d.app !== "never-twice" || !d.cfg || !Array.isArray(d.cfg.habits) || typeof d.months !== "object") throw new Error("shape");
    S.cfg = fixCfg(d.cfg); S.months = d.months || {}; LS.set("config", S.cfg); Object.keys(S.months).forEach(ym => LS.set("m-"+ym, S.months[ym]));
    S.tab = "today"; render(); toast("Backup imported");
  } catch(err) { toast("That file isn't a Never Twice backup."); }
});
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
boot();
})();
</script>

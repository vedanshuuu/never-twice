<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Never Twice</title>
<meta name="description" content="A daily habits app you shape yourself: habits, weekly rings, streaks, a focus timer, goals with deadlines and earn-it rules.">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Never Twice">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0}

/* Layout: single phone-first column, today-first; weekly rings as the anchor, a small progress ring on every habit row; bottom tab bar; habit detail as a full-screen layer. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EDF0F4; --line:#DCE2EA;
  --ink:#121722; --ink-2:#4A5466; --ink-3:#7C8697; --accent:#2B5BD7; --on-accent:#FFFFFF;
  --c1:#2B5BD7; --c2:#E2553A; --c3:#1F9D6B; --c4:#8A4FD3; --c5:#C98A00; --c6:#0F8FA8; --c7:#D2438F; --c8:#5B6B82;
  --warn:#B86E00; --warn-bg:#FFF4E0; --bad:#C2342B; --bad-bg:#FDECEA; --good:#1F8A5E; --good-bg:#E5F6EE;
  --shadow:0 1px 2px rgba(18,23,34,.04),0 6px 18px rgba(18,23,34,.05);
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#161B23; --sunk:#1F2530; --line:#29313D;
  --ink:#EEF1F6; --ink-2:#B3BCCB; --ink-3:#7F8A9C; --accent:#6E95FF; --on-accent:#0D1015;
  --c1:#6E95FF; --c2:#FF7A5C; --c3:#3CCB92; --c4:#B58CFF; --c5:#F0B63C; --c6:#3CC3DC; --c7:#FF7AB8; --c8:#9AA8BD;
  --warn:#F2B04A; --warn-bg:#2B2210; --bad:#FF6B5E; --bad-bg:#2D1614; --good:#4FD39B; --good-bg:#11271D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161B23; --sunk:#1F2530; --line:#29313D;
  --ink:#EEF1F6; --ink-2:#B3BCCB; --ink-3:#7F8A9C; --accent:#6E95FF; --on-accent:#0D1015;
  --c1:#6E95FF; --c2:#FF7A5C; --c3:#3CCB92; --c4:#B58CFF; --c5:#F0B63C; --c6:#3CC3DC; --c7:#FF7AB8; --c8:#9AA8BD;
  --warn:#F2B04A; --warn-bg:#2B2210; --bad:#FF6B5E; --bad-bg:#2D1614; --good:#4FD39B; --good-bg:#11271D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:13px} .note{font-size:12px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.link{border:0;background:none;padding:0;font-weight:600;text-align:left;font-family:var(--f-display);font-size:15px}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.added{opacity:.5}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:11px;font-weight:600;color:var(--ink-2)}
.skin i{width:38px;height:38px;border-radius:12px;border:2px solid transparent;display:block}
.skin[aria-pressed="true"] i{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.tick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--sunk);border:0;text-align:left;width:100%}
.tick .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.tick[aria-pressed="true"] .box{background:var(--hc,var(--accent));border-color:var(--hc,var(--accent))}
.tick[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick .t{font-weight:600} .tick .s{font-size:12px;color:var(--ink-3)}
.hab{display:flex;flex-direction:column;gap:10px;padding-block:12px;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.grp + .hab{border-top:0}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
.ringbtn{width:44px;height:44px;border:0;background:none;padding:0;border-radius:50%;display:block}
.hname{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.hname .t{font-family:var(--f-display);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname .s{font-size:12px;color:var(--ink-3)}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.sk{background:none;border:1px dashed var(--ink-3)}
.hval{font-family:var(--f-mono);font-size:13px;white-space:nowrap;text-align:right;color:var(--ink-2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--hc);flex:none}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hc,var(--accent));border-radius:99px;max-width:100%}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.ins input{background:var(--surface)} .ins .tick{background:var(--surface)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--accent)}
label.f,.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500;min-width:0}
.banner{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.banner.bad{background:var(--bad-bg)} .banner.bad h3{color:var(--bad)}
.banner.warn{background:var(--warn-bg)} .banner.warn h3{color:var(--warn)}
.banner.good{background:var(--good-bg)} .banner.good h3{color:var(--good)}
.why{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-display);font-size:16px;font-weight:500}
.rings{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .v{font-family:var(--f-mono);font-size:15px}
.big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.timer{font-family:var(--f-mono);font-size:40px;font-weight:500;letter-spacing:-.02em;color:var(--hc,var(--accent))}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:15px;font-weight:500;white-space:nowrap}
.stat .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.part{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.sl{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}
.svgtext{fill:var(--ink-3);font-family:var(--f-mono);font-size:9px}
.ins{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--sunk);border-radius:12px}
.ins b{font-family:var(--f-display);font-weight:600}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tpl:hover{border-color:var(--accent)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tpl .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tpl .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.tpl[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.tpl[aria-pressed="true"] .ck::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.deck{position:relative;height:360px;touch-action:pan-y}
.ico{display:inline-grid;place-items:center;font-size:1.05em;line-height:1;flex:none}
.bigico{font-size:44px;line-height:1}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink)}
.pchip[aria-pressed="false"]{opacity:.45;text-decoration:line-through;background:var(--sunk)}
.cust{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.cust .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.stp{display:flex;align-items:center;gap:8px}
.stp .btn{min-width:38px;height:38px;padding:0 8px}
.stp .num{min-width:64px;text-align:center;font-size:15px}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icogrid button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;padding:0}
.icogrid button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--sunk)}
.tplcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tplcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tplcard .tphead{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;width:100%}
.tplcard .tphead b{font-family:var(--f-display);font-size:17px;flex:1}
.tplcard .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.tplcard.on .ck{background:var(--accent);border-color:var(--accent)}
.tplcard.on .ck::after{content:"";width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.scard{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:48px 20px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(18,23,34,.10);user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab;overflow:hidden}
.scard.back{transform:scale(.94) translateY(12px);opacity:.55;pointer-events:none}
.scard .say{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.stamp{position:absolute;top:18px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;padding:3px 10px;border-radius:8px;border:2px solid;opacity:0}
.stamp.y{left:18px;color:var(--good)} .stamp.n{right:18px;color:var(--bad)}
.sbtns{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.sbtns .btn{padding:14px 10px;font-size:15px}
.sbtns .no{color:var(--bad)} .sbtns .yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:no-preference){.scard.fly{transition:transform .2s ease,opacity .2s ease}}
.stick{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.tpl b{font-family:var(--f-display);font-size:16px}
.tpl .hs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2)}
.tpl .hs span{display:inline-flex;align-items:center;gap:5px}
.tpl .hs i{width:7px;height:7px;border-radius:50%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:10px;text-align:center;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.cal button{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding:0;position:relative;overflow:hidden}
.cal button>i{position:absolute;inset:0;background:var(--hc);pointer-events:none}
.cal button>span{position:relative}
.cal button.on{color:#fff}
.cal button.sk{border:1px dashed var(--ink-3);background:transparent}
.cal button.sel{border:2px solid var(--ink)}
.cal button:disabled{opacity:.3;cursor:default}
.grid7{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,24px);gap:5px;align-items:center}
.grid7 .cell{width:24px;height:24px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--ink-3)}
.grid7 .cell>i{position:absolute;inset:0;background:var(--hc)}
.grid7 .hd{font-size:10px;text-align:center;color:var(--ink-3);font-weight:600}
.grid7 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;border:0;background:none;padding:0;text-align:left}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
ul.lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:8px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-top:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;max-width:92vw;display:flex;align-items:center;gap:10px;white-space:nowrap}
.toast:not(:has(button)){padding-right:14px}
.toast button{border:0;background:color-mix(in srgb, var(--bg) 18%, transparent);color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.hab.c{gap:0;padding-block:8px}
.hab .hx{display:flex;flex-direction:column;gap:8px;padding:10px 0 4px;margin-left:56px}
@media (max-width:400px){.hab .hx{margin-left:0}}
.hval{font-size:12px}
.s .dots{display:inline-flex;vertical-align:middle;margin-left:6px}
.hname .s{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.ringbtn.pop{animation:pop .35s ease}
.ritual{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.ritual .big{font-size:34px}
.emo{display:flex;gap:6px}
.emo button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-size:22px;line-height:1}
.emo button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--sunk)}
.ovl{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.ovl canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ovlcard{position:relative;background:var(--surface);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ovlcard .em{font-size:56px;line-height:1}

<script>
(() => {
/* ---------- helpers ---------- */
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], PAL = ["c1","c2","c3","c4","c5","c6","c7","c8"];
const TOD = [["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"],["any","Any time"]];
const SKINS = {ocean:{n:"Ocean",a:["#2B5BD7","#6E95FF"],bg:["#F3F5F8","#0D1015"]}, forest:{n:"Forest",a:["#1F7A52","#4FD39B"],bg:["#F1F5F2","#0B110E"]}, sunset:{n:"Sunset",a:["#D4502B","#FF8A5C"],bg:["#F8F4F0","#14100D"]},
  grape:{n:"Grape",a:["#7443C4","#B58CFF"],bg:["#F4F2F8","#100D15"]}, rose:{n:"Rose",a:["#C2367B","#FF7AB8"],bg:["#F8F2F5","#150D11"]}, graphite:{n:"Graphite",a:["#3A4658","#AEBBD0"],bg:["#F2F3F4","#0E0F11"]}};
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };

const daysBetween = (a,b) => Math.round((b-a)/86400000);
const fmt = (d,o={day:"numeric",month:"short"}) => d.toLocaleDateString("en-GB",o);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h1 = n => (Math.round(n*10)/10).toFixed(1);
const r1 = n => Math.round(n*10)/10;
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const ALL = [0,1,2,3,4,5,6], WK = [0,1,2,3,4];
const today = () => { const n = new Date(Date.now() - (+(S.cfg?.roll)||0)*3600000); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const wsI = () => S.cfg?.ws === "sun" ? 6 : 0;
const weekOf = d => addDays(d, -((dowIdx(d) - wsI() + 7) % 7));
const dowOrder = () => ALL.map(i => (i + wsI()) % 7);

/* ---------- library + templates ---------- */
const P = (name,type,o={}) => ({name,type,...o});
const LIB = {
  "Health":[P("Drink water","count",{target:8,unit:"glasses",color:"c6"}), P("Sleep 7+ hours","count",{noScale:true,target:7,unit:"h",color:"c4",tod:"morning",q:"How many hours did you sleep?"}), P("In bed by 11pm","check",{color:"c4",tod:"evening"}),
    P("Take vitamins","check",{color:"c5",tod:"morning"}), P("Eat vegetables","count",{target:3,unit:"servings",color:"c3"}), P("No added sugar","check",{color:"c7"}), P("Floss","check",{color:"c6",tod:"evening"}),
    P("No alcohol","check",{color:"c8"}), P("Cook at home","check",{sch:{k:"week",n:5},color:"c5"})],
  "Fitness":[P("Workout","check",{sch:{k:"week",n:3},color:"c2"}), P("Run","count",{target:5,unit:"km",sch:{k:"week",n:3},color:"c2"}), P("Steps","count",{target:8000,unit:"steps",step:1000,color:"c3"}),
    P("Stretch","time",{target:10,color:"c3",presets:[10,5]}), P("Yoga","time",{target:20,sch:{k:"week",n:3},color:"c4",presets:[20,10]}), P("Play a sport","check",{sch:{k:"week",n:1},color:"c5"}), P("Push-ups","count",{target:30,unit:"reps",step:10,color:"c2"})],
  "Mind":[P("Meditate","time",{target:10,color:"c3",tod:"morning",presets:[10,5]}), P("Journal","check",{color:"c4",tod:"evening"}), P("Gratitude list","count",{target:3,unit:"things",color:"c5",tod:"evening"}),
    P("Breathing exercise","time",{target:5,color:"c6",presets:[5,3]}), P("Time outdoors","time",{target:20,color:"c3",presets:[20,10]}), P("Call family or a friend","check",{sch:{k:"week",n:2},color:"c7"}), P("No phone for the first hour","check",{color:"c8",tod:"morning"})],
  "Learning":[P("Study","time",{target:60,color:"c1",tod:"evening"}), P("Read","time",{target:20,color:"c6",tod:"evening",presets:[20,10]}), P("Read pages","count",{target:20,unit:"pages",step:5,color:"c6"}),

    P("Side project","time",{target:45,sch:{k:"week",n:3},color:"c4"}), P("Job application","check",{sch:{k:"week",n:2},color:"c2"}), P("Networking message","check",{sch:{k:"week",n:3},color:"c7"})],
  "Home and money":[P("Tidy up","time",{target:10,color:"c3",presets:[10,5]}), P("Laundry","check",{sch:{k:"week",n:1},color:"c6"}), P("Track spending","check",{color:"c5",tod:"evening"}),

    P("Cigarettes","count",{target:0,unit:"",dir:"max",color:"c2"}), P("Snacks","count",{target:1,unit:"",dir:"max",color:"c5"})],
};
const ICONS = {"Drink water":"💧","Sleep 7+ hours":"😴","In bed by 11pm":"🛏️","Take vitamins":"💊","Eat vegetables":"🥦","No added sugar":"🍬","Floss":"🦷","No alcohol":"🍷","Cook at home":"🍳",
  "Workout":"🏋️","Run":"🏃","Steps":"👟","Stretch":"🙆","Yoga":"🤸","Play a sport":"⚽","Push-ups":"💪","Meditate":"🧘","Journal":"📓","Gratitude list":"🙏","Breathing exercise":"🌬️","Time outdoors":"🌳",
  "Call family or a friend":"📞","No phone for the first hour":"📵","Study":"📚","Read":"📖","Read pages":"📄","Language practice":"🗣️","Practise an instrument":"🎸","Online course":"🎓","Flashcards":"🗂️",
  "Deep work":"🎯","Plan the day":"🗓️","Clear inbox":"📥","Side project":"🚀","Job application":"💼","Networking message":"🤝","Tidy up":"🧹","Laundry":"🧺","Track spending":"💶","No-spend day":"🪙",
  "Weekly review":"🔁","Meal prep":"🥡","Budget check":"📊","Screen time":"📱","Social media":"📲","Coffee":"☕","Cigarettes":"🚬","Snacks":"🍪"};
const ICON_PICK = ["🎯","✅","🔥","⭐","💪","🏋️","🏃","🚴","🏊","⚽","🏏","🎾","🧘","🙆","👟","💧","🥦","🍎","🍳","🥡","☕","🍷","🍬","🍪","🚬","😴","🛏️","💊","🦷","📚","📖","📓","✍️","🗣️","🎸","🎨","🎓","🗂️","💼","🤝","🚀","💻","📥","🗓️","🧹","🧺","🪴","🌳","☀️","🌬️","🙏","📞","❤️","💶","🪙","📊","📱","📵","🎮","🐶"];
for (const list of Object.values(LIB)) for (const p of list) if (!p.icon) p.icon = ICONS[p.name] || "🎯";
const iconOf = h => h.icon || ICONS[h.name] || "🎯";
const ico = h => `<span class="ico" aria-hidden="true">${esc(iconOf(h))}</span>`;
const libFind = n => Object.values(LIB).flat().find(p => p.name === n);
function H(p, o={}){ const type = p.type || "check";
  return norm({id:uid(), name:p.name||"New habit", type, target:type==="time"?30:type==="count"?8:1, unit:"", dir:"min", step:1, sch:{k:"daily"}, tod:"any", color:"c1", ring:false, q:"", desc:"", presets:[25,10], start:key(today()), ...clone(p), ...o}); }
function norm(h){ // also migrates habits saved by the first version
  if (!h.sch) h.sch = h.type === "check" ? ((h.perWeek||7) >= 7 ? {k:"daily"} : {k:"week",n:h.perWeek}) : ((h.days||ALL).length === 7 ? {k:"daily"} : {k:"days",days:h.days});
  h.start = h.start || h.created || key(new Date()); h.dir = h.dir || "min"; h.tod = h.tod || "any"; h.unit = h.unit || ""; h.step = +h.step || 1;
  if (!Array.isArray(h.presets) || !h.presets.length) h.presets = [25,10]; if (!PAL.includes(h.color)) h.color = "c1";
  if (!h.icon) h.icon = ICONS[h.name] || "🎯";
  return h; }
const T = (name, desc, list) => ({name, desc, list});
const TEMPLATES = {
  exam:T("Exam + fitness","Daily study with a focus timer, gym three times a week, and small daily habits.",[["Study",{ring:true}],["Workout",{name:"Gym",ring:true}],["Meditate",{ring:true}],["Journal"],["Read"]]),
  student:T("Student","Study blocks, flashcards and reading, with sleep and a phone limit to protect them.",[["Study",{ring:true}],["Flashcards",{ring:true}],["Read pages"],["Sleep 7+ hours",{ring:true}],["Screen time"]]),
  fit:T("Fitness","Workouts, steps, water, stretching and sleep.",[["Workout",{sch:{k:"week",n:4},ring:true}],["Steps",{ring:true}],["Drink water",{ring:true}],["Stretch"],["Sleep 7+ hours"]]),
  runner:T("Runner","Three runs a week, stretching and recovery.",[["Run",{ring:true}],["Stretch",{ring:true}],["Sleep 7+ hours",{ring:true}],["Drink water"],["Workout",{name:"Strength session",sch:{k:"week",n:1}}]]),
  calm:T("Calm basics","Meditation, journaling, reading and time outdoors.",[["Meditate",{ring:true}],["Journal",{ring:true}],["Read",{ring:true}],["Time outdoors"],["Gratitude list"]]),
  morning:T("Morning routine","A fixed first hour: no phone, water, movement, a plan.",[["No phone for the first hour",{ring:true}],["Drink water"],["Stretch",{tod:"morning",ring:true}],["Meditate"],["Plan the day",{sch:{k:"daily"},ring:true}]]),
  sleep:T("Better sleep","A bedtime, a screen limit and less caffeine.",[["In bed by 11pm",{ring:true}],["Sleep 7+ hours",{ring:true}],["Coffee"],["Screen time",{ring:true}],["Read",{name:"Read before bed",target:15}]]),
  eat:T("Healthy eating","Vegetables, water, home cooking and fewer snacks.",[["Eat vegetables",{ring:true}],["Drink water",{ring:true}],["Cook at home",{ring:true}],["No added sugar"],["Snacks"],["Meal prep"]]),
  deep:T("Deep work","Protected focus blocks on weekdays, with planning and a weekly review.",[["Deep work",{ring:true}],["Plan the day",{ring:true}],["Clear inbox"],["Weekly review"],["Social media",{ring:true}]]),
  side:T("Side project","Regular sessions on your own project, plus outreach and a weekly review.",[["Side project",{ring:true}],["Networking message",{ring:true}],["Weekly review",{ring:true}],["Read"],["Social media"]]),
  job:T("Job hunt","Applications and networking every week, with skill-building alongside.",[["Job application",{ring:true}],["Networking message",{ring:true}],["Online course",{name:"Skill practice",ring:true}],["Weekly review"]]),
  lang:T("Language learning","Short daily practice, flashcards and a weekly lesson.",[["Language practice",{ring:true}],["Flashcards",{ring:true}],["Online course",{name:"Lesson",sch:{k:"week",n:2},ring:true}],["Read",{name:"Read in the language",target:10}]]),
  reader:T("Reader","Pages every day and less scrolling.",[["Read pages",{ring:true}],["Read",{ring:true}],["Social media",{ring:true}],["Journal",{name:"Note one idea"}]]),
  detox:T("Digital detox","Limits on phone and social media, with offline time instead.",[["Screen time",{ring:true}],["Social media",{ring:true}],["No phone for the first hour",{ring:true}],["Time outdoors"],["Read"]]),
  cut:T("Cut back","Daily limits you log against, with replacements for the urge.",[["Cigarettes",{ring:true}],["Coffee",{ring:true}],["No alcohol"],["Breathing exercise",{ring:true}],["Time outdoors"]]),
  home:T("Home reset","Small daily tidying and the weekly chores that pile up.",[["Tidy up",{ring:true}],["Laundry",{ring:true}],["Meal prep",{ring:true}],["Cook at home"],["Weekly review"]]),
  money:T("Money habits","Track spending, no-spend days and a regular budget check.",[["Track spending",{ring:true}],["No-spend day",{ring:true}],["Budget check",{ring:true}],["Cook at home"],["Side project"]]),
  blank:T("Start blank","No habits yet. Build your own from scratch or from the habit library.",[]),
};
const tplHabits = id => TEMPLATES[id].list.map(([n,o]) => H(libFind(n) || {name:n}, o||{}));
const newCfg = habits => ({v:2, habits, goals:[], rules:[], why:"", track:{sleep:true,energy:true,screen:false}, focusGate:false, tiny:true, group:true, hideDone:false, ws:"mon", roll:0, theme:"auto", skin:"ocean",
  earn:{on:false,label:"Night out",conds:[],manual:[]}});

/* ---------- state + storage ---------- */
const S = {cfg:null, months:{}, mode:"loading", slow:false, tab:"today", date:null, detail:null, edit:false, adding:false, setup:null, onboarding:false, cal:null, calDay:null, editG:null, db:null, base:null, memo:{}, standalone:!window.claude};
try { const t = localStorage.getItem("nt_tab"); if (t) S.tab = t; } catch(e){}
const dirty = {}, timers = {}, chains = {};
const LS = { get(k){ try { return JSON.parse(localStorage.getItem("nt_"+k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem("nt_"+k, JSON.stringify(v)); } catch(e){} } };
const fixCfg = c => { if (c) { c.habits = (c.habits||[]).map(norm); c.earn = c.earn || {on:false,label:"Reward",conds:[],manual:[]}; c.track = c.track || {}; c.goals = c.goals || []; c.rules = c.rules || []; } return c; };
function goLocal(msg){
  if (S.mode === "local") return;
  S.mode = "local";
  if (S.cfg) LS.set("config", S.cfg); else S.cfg = fixCfg(LS.get("config"));
  try { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k.startsWith("nt_m-")) { const ym = k.slice(5); if (!S.months[ym]) S.months[ym] = LS.get("m-"+ym) || {d:{}}; } } } catch(e){}
  Object.keys(S.months).forEach(ym => LS.set("m-"+ym, S.months[ym]));
  if (msg) toast(msg);
  render();
}
function queueWrite(id, get){
  dirty[id] = true; clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    const data = clone(get());
    chains[id] = (chains[id] || Promise.resolve()).then(async () => {
      if (S.mode === "db") { try { await S.base.doc(id).set(data); } catch(e){
        if (e && e.code === "quota_exceeded") toast("Storage is full. Can't save.");
        else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) goLocal("Saving on this device instead.");
        else toast("Couldn't save. Check your connection."); } }
      if (S.mode === "local") { LS.set(id, data); if (S.afterWrite) S.afterWrite(id); }
      delete dirty[id];
    });
  }, 450);
}
const saveCfg = () => { if (S.cfg) S.cfg.u = Date.now(); render(); queueWrite("config", () => S.cfg); };
const day = k => (S.months[k.slice(0,7)]?.d?.[k]) || {};
function saveDay(k, patch){ const ym = k.slice(0,7), m = S.months[ym] || {d:{}}; S.months[ym] = {...m, d:{...m.d, [k]:{...(m.d[k]||{}), ...patch, u:Date.now()}}}; render(); queueWrite("m-"+ym, () => S.months[ym]); }
const ent = (k,id) => day(k).h?.[id];
const val = (k,id) => +ent(k,id) || 0;
const skipped = (k,id) => !!day(k).s?.[id];
function setEnt(k,id,v){ const h = {...(day(k).h||{})}; if (v === undefined || v === null || Number.isNaN(v)) delete h[id]; else h[id] = v; saveDay(k,{h}); }
function setMap(k,f,id,v){ const m = {...(day(k)[f]||{})}; if (v) m[id] = v; else delete m[id]; saveDay(k,{[f]:m}); }

async function boot(){
  let db = null, user = null, id = null;
  try { db = await window.claude?.use?.("db"); user = await window.claude?.use?.("user"); id = user ? await user.id() : null; } catch(e){}
  if (!db || !id) { goLocal(); return; }
  S.db = db; S.base = db.collection("data/users/"+id);
  const slow = setTimeout(() => { if (S.mode === "loading") { S.slow = true; render(); } }, 10000);
  S.base.onSnapshot(snap => {
    let cfg = null;
    snap.docs.forEach(d => { if (d.id === "config") cfg = d.data(); else if (d.id.startsWith("m-") && !dirty[d.id]) S.months[d.id.slice(2)] = clone(d.data()); });
    if (!dirty.config) S.cfg = cfg ? fixCfg(clone(cfg)) : null;
    if (!snap.metadata.fromCache || S.cfg) { if (S.mode === "loading") S.mode = "db"; clearTimeout(slow); S.slow = false; }
    render();
  }, () => { clearTimeout(slow); goLocal(); });
}

/* ---------- habit maths ---------- */
const allHabits = () => S.cfg?.habits || [];
const habits = () => allHabits().filter(h => !h.archived);
const hab = id => allHabits().find(h => h.id === id);
const fixed = h => h.sch.k === "daily" || h.sch.k === "days";
const freq = h => { const s = h.sch; return s.k === "daily" ? 1 : s.k === "days" ? Math.max(1,s.days.length)/7 : s.k === "week" ? s.n/7 : s.k === "month" ? s.n/30 : 1/Math.max(1,s.n); };
const tgt = h => h.type === "check" ? 1 : Math.max(0, +h.target || 0);
const isMax = h => h.dir === "max" && h.type !== "check";
const unit = h => h.type === "time" ? "min" : (h.unit || "");
const scheduled = (h,k) => k >= h.start && (h.sch.k === "daily" || (h.sch.k === "days" && h.sch.days.includes(dowIdx(parse(k)))));
const met = (h,k) => { const e = ent(k,h.id); if (e === undefined) return false; return isMax(h) ? e <= tgt(h) : e >= tgt(h); };
const kept = (h,k) => met(h,k) || (S.cfg.tiny !== false && h.type === "time" && !isMax(h) && val(k,h.id) >= Math.min(10, tgt(h) || 10));
const frac = (h,k) => isMax(h) ? (met(h,k) ? 1 : 0) : Math.min(1, tgt(h) ? val(k,h.id)/tgt(h) : (val(k,h.id) ? 1 : 0));
function countKept(h, from, to){ let n = 0; for (let d = from; d <= to; d = addDays(d,1)) if (kept(h,key(d))) n++; return n; }
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
function lastKept(h, before){ let d = addDays(before,-1); for (let i=0;i<400;i++, d = addDays(d,-1)) { const k = key(d); if (k < h.start) return null; if (kept(h,k)) return d; } return null; }
function dueOn(h,k){
  if (k < h.start) return false; const s = h.sch, d = parse(k);
  if (fixed(h)) return scheduled(h,k);
  if (ent(k,h.id) !== undefined || skipped(k,h.id)) return true;
  if (s.k === "week") return countKept(h, weekOf(d), addDays(d,-1)) < s.n;
  if (s.k === "month") return countKept(h, monthStart(d), addDays(d,-1)) < s.n;
  const l = lastKept(h,d); return !l || daysBetween(l,d) >= s.n;
}
const perWeek = h => { const s = h.sch; return s.k === "daily" ? 7 : s.k === "days" ? s.days.length : s.k === "week" ? s.n : s.k === "month" ? s.n*7/30 : 7/Math.max(1,s.n); };
const weekTarget = h => isMax(h) || h.type === "check" ? perWeek(h) : tgt(h) * perWeek(h);
function weekDone(h, ws, upTo){ let t = 0; for (let i=0;i<7;i++){ const k = key(addDays(ws,i)); if (upTo && k > upTo) break; t += isMax(h) ? (met(h,k)?1:0) : h.type === "check" ? (kept(h,k)?1:0) : val(k,h.id); } return t; }
function expected(h, ws, upTo){ let t = 0, n = 0; for (let i=0;i<7;i++){ const k = key(addDays(ws,i)); if (k > upTo) break; n++; if (fixed(h) && scheduled(h,k) && !skipped(k,h.id)) t += isMax(h) || h.type === "check" ? 1 : tgt(h); } return fixed(h) ? t : weekTarget(h)*n/7; }
const progress = (h, ws) => { const wt = weekTarget(h); return wt ? weekDone(h,ws)/wt : 0; };
const dayTarget = (h,k) => k < h.start ? 0 : fixed(h) ? (scheduled(h,k) ? tgt(h) : 0) : tgt(h)*freq(h);
function expectedFair(h, ws, tk){ // today only counts once it's done, so mornings never look like failure

  html += `<div class="card"><div class="row between"><h2>Weekly score</h2><span class="note">Last 12 weeks</span></div><svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Weekly score for the last 12 weeks">${bars}</svg></div>`;

    <div class="small"><b>${esc(s.user.email)}</b><br><span class="muted">Last synced: ${last}${A.syncing ? " · syncing…" : ""}</span></div>
    <div class="row"><button class="btn sm" data-acc="sync" ${dis}>Sync now</button><button class="btn sm" data-acc="signout" ${dis}>Sign out</button></div>${msg}
    <h2>Reminders</h2>${rem}
    <details><summary>Delete my cloud data</summary><p class="note" style="margin-top:8px">Removes everything stored in your account and signs you out. The copy on this device stays.</p><button class="btn sm danger" data-acc="wipe" ${dis}>${A.confirm ? "Tap again to delete" : "Delete cloud data"}</button></details></div>`;
}
async function afterSignIn(){
  A.step = "idle"; A.msg = ""; let has = false;
  try { has = ((await rest("/nt_docs?select=id&id=eq.config")) || []).length > 0; } catch(e){}
  if (has && S.cfg && habits().length) { A.step = "choose"; render(); return; }
  await syncAll(has ? true : undefined); pushCheck().then(render);
}
document.getElementById("app").addEventListener("click", async e => {
  const b = e.target.closest("[data-acc]"); if (!b || A.busy) return; const act = b.dataset.acc;
  if (act !== "wipe") A.confirm = false; if (act !== "unpair") A.unpair = null; A.busy = true; A.msg = "";
  try {
    const emv = () => (document.getElementById("accEmail")?.value || "").trim().toLowerCase(), okEm = em => /^\S+@\S+\.\S+$/.test(em);
    if (act === "send") { const em = emv();
      if (!okEm(em)) A.msg = "Enter a valid email address."; else { A.email = em; await authCall("/otp?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {email:em, create_user:true}); A.step = "link"; } }
    else if (act === "signin" || act === "signup") { const em = emv(), pw = document.getElementById("accPass")?.value || ""; A.email = em;
      if (!okEm(em)) A.msg = "Enter a valid email address."; else if (act === "signup" && pw.length < 8) A.msg = "Use at least 8 characters for the password."; else if (!pw) A.msg = "Enter your password.";
      else { const j = act === "signup" ? await authCall("/signup", {email:em, password:pw}) : await authCall("/token?grant_type=password", {email:em, password:pw});
        if (!j.access_token) A.msg = "Account created, but Supabase is still set to confirm emails first. Turn off \"Confirm email\" (see the setup guide), then sign in.";
        else { setSession(j); A.busy = false; await afterSignIn(); toast(act === "signup" ? "Account created" : "Signed in"); } } }
    else if (act === "verify") { const code = (document.getElementById("accCode")?.value || "").replace(/\s/g,"");
      if (!code) A.msg = "Enter the code from the email."; else { setSession(await authCall("/verify", {type:"email", email:A.email, token:code})); A.busy = false; await afterSignIn(); toast("Signed in"); } }
    else if (act === "reset") { A.step = "idle"; }
    else if (act === "use-remote" || act === "use-local") { A.step = "idle"; await syncAll(act === "use-remote"); pushCheck().then(render); }
    else if (act === "sync") { await syncAll(); if (!A.msg) toast("Synced"); }
    else if (act === "push-on") { await pushOn(); }
    else if (act === "push-off") { await pushOff(); }
    else if (act === "signout") { try { await pushOff(); } catch(e){} try { await authCall("/logout", {}, A.session.access_token); } catch(e){} setSession(null); A.step = "idle"; A.pub = null; A.partners = []; toast("Signed out. Your data is still on this device."); }
    else if (act === "pair") { const code = (document.getElementById("pairCode")?.value || "").trim().toUpperCase(); A.pmsg = "";
      if (!/^[A-Z0-9]{6}$/.test(code)) A.pmsg = "Partner codes are 6 letters and numbers."; else if (code === A.pub?.code) A.pmsg = "That's your own code.";
      else { try { await publishSummary(); const r = await rest("/rpc/nt_join", {method:"POST", body:{p_code:code}}); await loadPartners(); toast(`Paired${r && r.name ? ` with ${r.name}` : ""}`); }
        catch(e) { A.pmsg = e.status === 400 || e.status === 404 ? "No one has that code. Check it with your friend." : "Couldn't pair just now. Try again."; } } }
    else if (act === "unpair") { if (A.unpair !== b.dataset.v) { A.unpair = b.dataset.v; } else { A.unpair = null; await rest("/rpc/nt_leave", {method:"POST", body:{p_partner:b.dataset.v}}); await loadPartners(); toast("Partner removed"); } }
    else if (act === "copy-code") { try { await navigator.clipboard.writeText(A.pub.code); toast("Code copied"); } catch(e) { toast("Your code is " + A.pub.code); } }
    else if (act === "wipe") { if (!A.confirm) A.confirm = true; else { A.confirm = false; const id = A.session.user.id; try { await pushOff(); } catch(e){}
      await rest("/nt_docs?user_id=eq." + id, {method:"DELETE"}); await rest("/nt_push?user_id=eq." + id, {method:"DELETE"});
      try { for (const p of A.partners) await rest("/rpc/nt_leave", {method:"POST", body:{p_partner:p.user_id}}); await rest("/nt_public?user_id=eq." + id, {method:"DELETE"}); } catch(e){} A.pub = null; A.partners = [];
      try { await authCall("/logout", {}, A.session.access_token); } catch(e){} setSession(null); toast("Cloud data deleted"); } }
  } catch(err) {
    const em_ = String(err.msg || "").toLowerCase();
    A.msg = err.status === 429 ? "Too many tries. Wait a minute, then try again."
      : act === "signin" ? (em_.includes("confirm") ? "This email isn't confirmed yet. Turn off \"Confirm email\" in Supabase, then try again." : err.status === 400 ? "Wrong email or password." : "Couldn't sign in. Check your connection and try again.")
      : act === "signup" ? (em_.includes("already") || err.status === 422 && em_.includes("regist") ? "That email already has an account. Switch to Sign in." : err.msg && err.status < 500 ? err.msg : "Couldn't create the account. Check your connection and try again.")
      : act === "verify" ? "That code didn't work. Check it, or ask for a new one." : act === "send" ? (err.msg || "Couldn't send the code. Check the address and try again.") : act.startsWith("push") ? "Couldn't change reminders on this device." : "That didn't work. Check your connection and try again.";
  } finally { A.busy = false; render(); }
});
document.getElementById("app").addEventListener("change", e => { if (e.target.id === "sumTime" && S.cfg) { S.cfg.summary = e.target.value || ""; saveCfg(); }
  if (e.target.id === "shareName" && S.cfg) { S.cfg.shareName = e.target.value.trim().slice(0,40); saveCfg(); } });
document.getElementById("app").addEventListener("click", e => { const b = e.target.closest('[data-act="acc-mode"]'); if (!b) return; const em = document.getElementById("accEmail"); if (em) A.email = em.value.trim(); A.mode = b.dataset.v; A.msg = ""; render(); });
document.getElementById("app").addEventListener("click", e => { const b = e.target.closest('[data-act="share-names"]'); if (!b || !S.cfg) return; S.cfg.shareNames = b.dataset.v === "1"; saveCfg(); });
(async () => { // start-up: finish a sign-in link if one was used, then sync
  S.signedIn = !!A.session; setCan(); if (!cloud) return;
  if (location.hash.includes("access_token=")) { const q = new URLSearchParams(location.hash.slice(1));
    try { const user = await authCall("/user", null, q.get("access_token"), "GET"); setSession({access_token:q.get("access_token"), refresh_token:q.get("refresh_token"), expires_in:q.get("expires_in"), user}); history.replaceState(null, "", location.pathname + location.search); await afterSignIn(); } catch(e){} }
  else if (A.session) { await syncAll(); await pushCheck(); render(); }
})();

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
boot();
})();
</script>
